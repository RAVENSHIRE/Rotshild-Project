<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign in — Institutional Portfolio Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="firebase-config.js"></script>
</head>
<body>

<div class="login-wrap">
    <form class="card login-card" id="login-form">
        <div class="brand">
            <div class="logo">PC</div>
            <div class="brand-text">
                <h2>PHANTOM</h2>
                <p>Institutional Terminal</p>
            </div>
        </div>
        <h1>Sign in</h1>
        <p class="sub">Access the portfolio analytics workspace.</p>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <p class="auth-error" id="auth-error"></p>
        <button class="btn-primary" type="submit">Sign in</button>
        <button class="btn-ghost" type="button" id="demo-btn">Continue in demo mode</button>
    </form>
</div>

<script type="module">
    import { auth } from "./firebase-config.js";

    document.getElementById("demo-btn").addEventListener("click", () => {
        window.location.href = "index.html";
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errEl = document.getElementById("auth-error");
        if (!auth) {
            errEl.textContent = "Firebase is not configured yet — use demo mode, or fill in firebase-config.js.";
            return;
        }
        try {
            const { signInWithEmailAndPassword } =
                await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
            await signInWithEmailAndPassword(
                auth,
                document.getElementById("email").value,
                document.getElementById("password").value
            );
            // onAuthStateChanged in firebase-config.js handles the redirect.
        } catch (err) {
            errEl.textContent = "Sign-in failed: check your email and password.";
            console.error(err);
        }
    });
</script>
</body>
</html>
